# Signed, notarized Mac builds for both architectures on every version tag.
# The PyInstaller core can only be frozen on its own architecture, so arm64
# builds on an Apple Silicon runner and x64 on an Intel one. Secrets live in
# the "release" environment: CSC_LINK (base64 Developer ID .p12),
# CSC_KEY_PASSWORD, APPLE_API_KEY (.p8 contents), APPLE_API_KEY_ID,
# APPLE_API_ISSUER. Nothing here echoes a secret.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # upload assets to the GitHub release

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Freeze the towereye core
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller
          .venv/bin/pyinstaller --noconfirm --distpath packaging/dist --workpath packaging/build packaging/towereye.spec
          packaging/dist/towereye-core/towereye-core --help | head -1

      - name: Write the App Store Connect API key
        run: |
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Build, sign, notarize, upload
        working-directory: companion/desktop
        run: |
          npm ci
          npx electron-builder --mac --${{ matrix.arch }} --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
