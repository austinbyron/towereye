<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px 14px; min-width: 200px; background: #14181f; color: #e6ebf2; }
  h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #56606e; display: inline-block; }
  .dot.on { background: #3ddc84; }
  label { display: flex; align-items: center; gap: 8px; }
  select { flex: 1; font-size: 14px; padding: 4px 6px; background: #1d232c; color: inherit; border: 1px solid #333c48; border-radius: 4px; }
  .muted { color: #aab6c6; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span> towereye</h1>
<label>die on the tray
  <select id="die">
    <option value="auto">auto</option>
    <option value="d4">d4</option>
    <option value="d6">d6</option>
    <option value="d8">d8</option>
    <option value="d10">d10</option>
    <option value="d12">d12</option>
    <option value="d20">d20</option>
  </select>
</label>
<div class="muted" id="note">connecting to the watch…</div>
<script src="popup.js"></script>
</body>
</html>
